name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The test suite is deliberately torch-free, so CI installs only the
      # two packages it imports (pytest and Pillow). The ML stack, the model
      # checkpoint, and the dataset are not needed and are not exercised here.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest Pillow

      - name: Compile sources
        run: python -m compileall -q app src scripts tests

      - name: Run tests
        run: python -m pytest -q
